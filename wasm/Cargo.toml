[package]
name = "rbxm-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "rbxm_core"

[dependencies]
# default-features = false is what keeps axum/tokio (and therefore mio) out of this build.
rbxm_core = { package = "rbxm-api", path = "..", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
