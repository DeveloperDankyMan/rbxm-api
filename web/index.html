<!doctype html>
<meta charset="utf-8">
<title>rbxm-api</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
  h1 { color: #333; }
  nav { margin: 20px 0; }
  nav a { margin-right: 15px; padding: 8px 12px; background: #0366d6; color: white; text-decoration: none; border-radius: 4px; cursor: pointer; }
  nav a:hover { background: #0256c7; }
  nav a.active { background: #28a745; }
  .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
  input[type="file"], textarea, button, input[type="text"] { font-size: 14px; padding: 8px; }
  textarea, input[type="text"] { font-family: monospace; width: 100%; box-sizing: border-box; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; max-height: 400px; }
  button { background: #0366d6; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 10px 16px; }
  button:hover { background: #0256c7; }
  .error { color: #d73a49; }
  .success { color: #28a745; }
  .info { color: #6f42c1; }
  .hidden { display: none; }
</style>
<head>
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the route part of the path, and not
      // the real directory in which the app resides, for example:
      // https://username.github.io/repo-name/one/two?a=b&c=d#qwe becomes
      // https://username.github.io/repo-name/?/one/two&a=b~and~c=d#qwe
      // Otherwise, leave pathSegmentsToKeep as 0.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );

    </script>
  </head>

<h1>RBXM ⇄ JSON</h1>
<p class="info">All processing in your browser using WASM</p>

<nav>
  <a href="#/health">Health</a>
  <a href="#/decode">Decode</a>
  <a href="#/encode">Encode</a>
  <a href="#/schema">Schema</a>
  <a href="#/schemas">Schemas</a>
</nav>

<div id="app"></div>

<script type="module">
  import init, {
    rbxm_to_json,
    json_to_rbxm,
    class_schema_json,
    class_schemas_json
  } from "./pkg/rbxm_api.js";

  await init();
  console.log("WASM initialized!");

  function route() {
    const hash = window.location.hash.slice(1) || "/health";
    console.log("Current hash:", hash);
    
    const app = document.getElementById("app");

    // Parse the hash: /#/route/param1/param2
    const segments = hash.split("/").filter(s => s.length > 0);
    const routeName = segments[0];
    const param = segments.slice(1).join("/"); // handle multi-part params

    console.log("Route:", routeName, "Param:", param);

    // Direct schema response: /#/schema/Part
    if (routeName === "schema" && param && param.length > 0) {
      try {
        const schemaString = class_schema_json(param);
        const schema = JSON.parse(schemaString);
        app.innerHTML = `
          <div class="section">
            <h2>Schema: ${param}</h2>
            <pre>${JSON.stringify(schema, null, 2)}</pre>
          </div>
        `;
      } catch (err) {
        app.innerHTML = `
          <div class="section error">
            <h2>Error</h2>
            <pre>${err.message || String(err)}</pre>
          </div>
        `;
      }
      return;
    }

    // Direct schemas response: /#/schemas/Part,Model,Script
    if (routeName === "schemas" && param && param.length > 0) {
      try {
        const schemasString = class_schemas_json(param);
        const schemas = JSON.parse(schemasString);
        app.innerHTML = `
          <div class="section">
            <h2>Schemas: ${param}</h2>
            <pre>${JSON.stringify(schemas, null, 2)}</pre>
          </div>
        `;
      } catch (err) {
        app.innerHTML = `
          <div class="section error">
            <h2>Error</h2>
            <pre>${err.message || String(err)}</pre>
          </div>
        `;
      }
      return;
    }

    // Routes with interactive forms
    if (routeName === "health" || routeName === "") {
      app.innerHTML = `
        <div class="section">
          <h2>Health</h2>
          <button id="healthBtn">Check</button>
          <pre id="healthOut"></pre>
        </div>
      `;
      document.getElementById("healthBtn").onclick = () => {
        document.getElementById("healthOut").textContent = "ok";
        document.getElementById("healthOut").className = "success";
      };
      return;
    }

    if (routeName === "decode") {
      app.innerHTML = `
        <div class="section">
          <h2>Decode: .rbxm → JSON</h2>
          <input type="file" id="in" accept=".rbxm">
          <pre id="out"></pre>
        </div>
      `;
      document.getElementById("in").onchange = async (e) => {
        const out = document.getElementById("out");
        try {
          const bytes = new Uint8Array(await e.target.files[0].arrayBuffer());
          console.log("File bytes:", bytes.length);
          
          const jsonString = rbxm_to_json(bytes);
          console.log("WASM returned:", jsonString);
          
          const data = JSON.parse(jsonString);
          out.textContent = JSON.stringify(data, null, 2);
          out.className = "success";
        } catch (err) {
          console.error("Error:", err);
          out.textContent = `Error: ${err.message || String(err)}`;
          out.className = "error";
        }
      };
      return;
    }

    if (routeName === "encode") {
      app.innerHTML = `
        <div class="section">
          <h2>Encode: JSON → .rbxm</h2>
          <textarea id="json" rows="10" placeholder='{"instances":[{"id":"1","class":"Model","name":"MyModel","parent":null,"properties":{}}]}'></textarea><br><br>
          <button id="enc">Download .rbxm</button>
          <pre id="out"></pre>
        </div>
      `;
      document.getElementById("enc").onclick = () => {
        const out = document.getElementById("out");
        try {
          const jsonText = document.getElementById("json").value.trim();
          if (!jsonText) {
            out.textContent = "Error: JSON field is empty";
            out.className = "error";
            return;
          }

          console.log("JSON input:", jsonText);
          const bytes = json_to_rbxm(jsonText);
          console.log("WASM returned bytes:", bytes.length);
          
          const blob = new Blob([bytes], { type: "application/octet-stream" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "out.rbxm";
          a.click();

          out.textContent = `✓ Downloaded ${bytes.length} bytes`;
          out.className = "success";
        } catch (err) {
          console.error("Error:", err);
          out.textContent = `Error: ${err.message || String(err)}`;
          out.className = "error";
        }
      };
      return;
    }

    if (routeName === "schema") {
      app.innerHTML = `
        <div class="section">
          <h2>Schema</h2>
          <p>Enter a class name or use direct URL like <code>/#/schema/Part</code></p>
          <input type="text" id="classInput" placeholder="Part" style="margin-bottom: 10px;">
          <button id="schemaBtn">Get Schema</button>
          <pre id="schemaOut"></pre>
        </div>
      `;
      document.getElementById("schemaBtn").onclick = () => {
        const className = document.getElementById("classInput").value.trim();
        if (className) {
          window.location.hash = `#/schema/${className}`;
        }
      };
      document.getElementById("classInput").onkeypress = (e) => {
        if (e.key === "Enter") document.getElementById("schemaBtn").click();
      };
      return;
    }

    if (routeName === "schemas") {
      app.innerHTML = `
        <div class="section">
          <h2>Schemas (Batch)</h2>
          <p>Enter class names or use direct URL like <code>/#/schemas/Part,Model,Script</code></p>
          <input type="text" id="classesInput" placeholder="Part,Model,Script" style="margin-bottom: 10px;">
          <button id="schemasBtn">Get Schemas</button>
          <pre id="schemasOut"></pre>
        </div>
      `;
      document.getElementById("schemasBtn").onclick = () => {
        const classes = document.getElementById("classesInput").value.trim();
        if (classes) {
          window.location.hash = `#/schemas/${classes}`;
        }
      };
      document.getElementById("classesInput").onkeypress = (e) => {
        if (e.key === "Enter") document.getElementById("schemasBtn").click();
      };
      return;
    }

    // 404
    app.innerHTML = `<div class="section error"><h2>Route not found</h2></div>`;
  }

  route();
  window.addEventListener("hashchange", route);
</script>
