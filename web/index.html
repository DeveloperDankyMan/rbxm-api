<!doctype html>
<meta charset="utf-8">
<title>rbxm-api</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
  h1 { color: #333; }
  .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
  input[type="file"], textarea, button, input[type="text"] { font-size: 14px; padding: 8px; }
  textarea, input[type="text"] { font-family: monospace; width: 100%; box-sizing: border-box; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; max-height: 400px; }
  button { background: #0366d6; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 10px 16px; }
  button:hover { background: #0256c7; }
  .error { color: #d73a49; }
  .success { color: #28a745; }
  .info { color: #6f42c1; }
</style>

<h1>RBXM ⇄ JSON</h1>
<p class="info">This page uses the browser-built WASM API, so it behaves like the same encode/decode/schema endpoints without needing a Rust server.</p>

<div id="app"></div>

<script type="module">
  import init, {
    rbxm_to_json,
    json_to_rbxm,
    class_schema_json,
    class_schemas_json
  } from "./pkg/rbxm_api.js";

  await init();

  const app = document.getElementById("app");

  function route() {
    const path = window.location.pathname.replace(/\/+$/, "") || "/";
    const last = path.split("/").filter(Boolean).pop() || "home";
    const params = new URLSearchParams(window.location.search);

    if (last === "health") {
      return renderHealth();
    }

    if (last === "encode") {
      const json = params.get("data") || "";
      try {
        const bytes = json_to_rbxm(json);
        const preview = `Encoded ${bytes.length} bytes`;
        return renderResult("/encode", {
          ok: true,
          data: bytes,
          note: preview,
          raw: JSON.stringify({ bytes: bytes.length, ok: true }, null, 2)
        });
      } catch (err) {
        return renderError("/encode", String(err));
      }
    }

    if (last === "decode") {
      try {
        const raw = params.get("data") || "";
        const json = rbxm_to_json(Uint8Array.from(atob(raw), c => c.charCodeAt(0)));
        return renderResult("/decode", {
          ok: true,
          raw: JSON.stringify(JSON.parse(json), null, 2),
          note: "Decoded from base64 payload"
        });
      } catch (err) {
        return renderError("/decode", String(err));
      }
    }

    if (last === "schema") {
      const className = params.get("class") || "Part";
      try {
        const schema = class_schema_json(className);
        return renderResult(`/schema?class=${className}`, {
          ok: true,
          raw: JSON.stringify(JSON.parse(schema), null, 2),
          note: `Schema for ${className}`
        });
      } catch (err) {
        return renderError("/schema", String(err));
      }
    }

    if (last === "schemas") {
      const classes = params.get("classes") || "Part,Model,Script";
      try {
        const schemas = class_schemas_json(classes);
        return renderResult(`/schemas?classes=${classes}`, {
          ok: true,
          raw: JSON.stringify(JSON.parse(schemas), null, 2),
          note: `Schemas for ${classes}`
        });
      } catch (err) {
        return renderError("/schemas", String(err));
      }
    }

    return renderDefaultUI();
  }

  function renderResult(route, data) {
    app.innerHTML = `
      <div class="section">
        <h2>Route: <code>${route}</code></h2>
        <p class="success">${data.note}</p>
        <pre>${data.raw}</pre>
      </div>
      <div class="section">
        <button onclick="window.location.href='/'">Back to tool</button>
      </div>
    `;
  }

  function renderError(route, msg) {
    app.innerHTML = `
      <div class="section">
        <h2>Route: <code>${route}</code></h2>
        <p class="error">${msg}</p>
      </div>
      <div class="section">
        <button onclick="window.location.href='/'">Back to tool</button>
      </div>
    `;
  }

  function renderHealth() {
    app.innerHTML = `
      <div class="section">
        <h2>Route: <code>/health</code></h2>
        <pre>ok</pre>
      </div>
      <div class="section">
        <button onclick="window.location.href='/'">Back to tool</button>
      </div>
    `;
  }

  function renderDefaultUI() {
    app.innerHTML = `
      <div class="section">
        <h2>Health</h2>
        <button id="healthBtn">GET /health</button>
        <pre id="healthOut">ok</pre>
      </div>

      <div class="section">
        <h2>Decode</h2>
        <p><b>POST /decode</b> — Convert .rbxm file to JSON</p>
        <input type="file" id="in" accept=".rbxm">
        <pre id="out"></pre>
      </div>

      <div class="section">
        <h2>Encode</h2>
        <p><b>POST /encode</b> — Convert JSON to .rbxm file</p>
        <textarea id="json" rows="10" placeholder='{"instances":[{"id":"1","class":"Model","name":"MyModel","parent":null,"properties":{}}]}'></textarea><br><br>
        <button id="enc">Download .rbxm</button>
      </div>

      <div class="section">
        <h2>Schema</h2>
        <p><b>GET /schema/:class</b></p>
        <input type="text" id="classInput" placeholder="Part" style="margin-bottom: 10px;">
        <button id="schemaBtn">Get Schema</button>
        <pre id="schemaOut"></pre>
      </div>

      <div class="section">
        <h2>Schemas</h2>
        <p><b>GET /schemas?classes=A,B,C</b></p>
        <input type="text" id="classesInput" placeholder="Part,Model,Script" style="margin-bottom: 10px;">
        <button id="schemasBtn">Get Schemas</button>
        <pre id="schemasOut"></pre>
      </div>
    `;

    document.getElementById("healthBtn").onclick = () => {
      document.getElementById("healthOut").textContent = "ok";
    };

    document.getElementById("in").onchange = async (e) => {
      const out = document.getElementById("out");
      try {
        const bytes = new Uint8Array(await e.target.files[0].arrayBuffer());
        const json = rbxm_to_json(bytes);
        out.textContent = JSON.stringify(JSON.parse(json), null, 2);
      } catch (err) {
        out.textContent = String(err);
      }
    };

    document.getElementById("enc").onclick = () => {
      const out = document.getElementById("out");
      try {
        const bytes = json_to_rbxm(document.getElementById("json").value.trim());
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([bytes]));
        a.download = "out.rbxm";
        a.click();
        out.textContent = `✓ Downloaded ${bytes.length} bytes`;
      } catch (err) {
        out.textContent = String(err);
      }
    };

    document.getElementById("schemaBtn").onclick = () => {
      const out = document.getElementById("schemaOut");
      try {
        const className = document.getElementById("classInput").value.trim() || "Part";
        const schema = class_schema_json(className);
        out.textContent = JSON.stringify(JSON.parse(schema), null, 2);
      } catch (err) {
        out.textContent = String(err);
      }
    };

    document.getElementById("schemasBtn").onclick = () => {
      const out = document.getElementById("schemasOut");
      try {
        const classes = document.getElementById("classesInput").value.trim() || "Part,Model,Script";
        const schemas = class_schemas_json(classes);
        out.textContent = JSON.stringify(JSON.parse(schemas), null, 2);
      } catch (err) {
        out.textContent = String(err);
      }
    };
  }

  route();
</script>
