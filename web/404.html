<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // This script checks if the current URL is a custom route and redirects to index.html
      // while preserving the route path in the query string.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + (l.pathname.slice(1).split('/')[0] === 'your-repo-name' ? 1 : 0)).join('/') +
        '/?p=' + l.pathname.slice(1).split('/').slice(l.pathname.slice(1).split('/')[0] === 'your-repo-name' ? 1 : 0).join('/') +
        l.search + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
