name: Deploy Rust WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache Setup
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI Tool
        run: |
          cargo install dioxus-cli --version 0.6.0-alpha.5 || cargo install dioxus-cli

      - name: Compile Rust project to Static WASM Assets
        run: |
          # This compiles your rust files and creates a './dist' folder with index.html and wasm payload
          dx build --release --platform web

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target/dx/rbxm-api/release/web/public # Maps to output compilation directory

  deploy-site:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Assets to GitHub Pages Target
        id: deployment
        uses: actions/deploy-pages@v4
