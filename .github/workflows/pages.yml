name: Deploy Rust WASM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache Setup
        uses: Swatinem/rust-cache@v2

      # Optimized: Downloads the pre-compiled binary instead of compiling from source
      - name: Install Dioxus CLI Tool
        run: |
          wget -qO- https://github.com | tar -xz
          chmod +x dx
          sudo mv dx /usr/local/bin/

      - name: Compile Rust project to Static WASM Assets
        run: |
          dx build --release --platform web

      # FIXED: Points to the standard, unified Dioxus build distribution directory
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist 

  deploy-site:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Assets to GitHub Pages Target
        id: deployment
        uses: actions/deploy-pages@v4
