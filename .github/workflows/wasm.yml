name: build wasm

on:
  push:
    branches: [main]
    paths:
      - "wasm/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

# Lets this workflow push its own commit back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # --no-default-features is the important part: the "server" feature (axum/tokio)
      # is on by DEFAULT (needed for the native server binary), and tokio pulls in mio,
      # which doesn't support wasm32-unknown-unknown. Without this flag the wasm build
      # fails trying to compile tokio's networking code for a target that can't have it.
      #
      # --target web: output is a plain ES module (rbxm_core.js + rbxm_core_bg.wasm),
      # loadable with <script type="module"> or any modern JS bundler. Change to
      # --target nodejs if you specifically need `require()` instead of `import`.
      #
      # --out-dir wasm/pkg: wasm-pack's own convention is to name its output folder
      # "pkg"; nesting it under wasm/ just keeps it visually grouped in the repo.
      - name: Build
        run: wasm-pack build --target web --release --out-dir wasm/pkg -- --no-default-features

      # Still attached to this run under Actions > this run > Artifacts, as before.
      - uses: actions/upload-artifact@v4
        with:
          name: rbxm-wasm
          path: wasm/pkg/
          if-no-files-found: error

      # ALSO commit the built files into the repo itself, so wasm/pkg/ in the Code tab
      # always matches the latest build. Safe from triggering itself in a loop: this
      # workflow's `paths:` filter only watches src/**, Cargo.toml, Cargo.lock and this
      # file — none of which this commit touches.
      - name: Commit built wasm output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wasm/pkg
          if git diff --cached --quiet; then
            echo "wasm/pkg unchanged, nothing to commit"
          else
            git commit -m "chore: update wasm/pkg [skip ci]"
            git push
          fi
