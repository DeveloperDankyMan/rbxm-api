name: Docker Build & Shared Serveo Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-tunnel:
    timeout-minutes: 70
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Launch Ephemeral Serveo Tunnel (With Auto-Generated Key)
        env:
          SUBDOMAIN: ${{ github.event.repository.name }}
        run: |
          echo "🔑 Generating temporary SSH key pair on the runner..."
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_serveo
          chmod 600 ~/.ssh/id_serveo
          
          echo "🔗 Fetching host identity keys..."
          ssh-keyscan -H serveo.net >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "🔗 Connecting to Serveo..."
          # Removed ExitOnForwardFailure so it falls back gracefully instead of crashing
          ssh -i ~/.ssh/id_serveo \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -R "${SUBDOMAIN}:80:localhost:8080" serveo.net > serveo.log 2>&1 &
            
          echo "⏳ Waiting for tunnel handshake..."
          sleep 5
          
          echo "=========================================================="
          echo "✨ YOUR ACTIVE PUBLIC URL IS:"
          # This extracts the actual URL assigned by Serveo out of the log file
          grep -o 'https://[^ ]*' serveo.log || echo "https://${SUBDOMAIN}.serveo.net (Assuming requested domain)"
          echo "=========================================================="
          
          echo "📋 Checking connection logs..."
          cat serveo.log

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnels are active! Keeping the GitHub runner awake..."
          sleep 1h
