name: Docker Build & Shared Wormhole Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-tunnel:
    timeout-minutes: 70
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Launch Ephemeral Wormhole Tunnel
        env:
          SUBDOMAIN: ${{ github.event.repository.name }}
          WORMHOLE_TOKEN: ${{ secrets.WORMHOLE_TOKEN }}
        run: |
          echo "📥 Downloading Wormhole CLI onto the runner..."
          curl -fsSL https://wormhole.bar/install.sh | sh
          
          echo "🔗 Connecting to Wormhole..."
          # Routes your dynamic subdomain token directly through the CLI tool backgrounded (&)
          # Note that port 8080 is targeted to match your container's port mapping
          wormhole http 8080 --subdomain "${SUBDOMAIN}" > wormhole.log 2>&1 &
            
          echo "⏳ Waiting for tunnel handshake..."
          sleep 5
          
          echo "=========================================================="
          echo "✨ YOUR ACTIVE PUBLIC URL IS:"
          echo "https://${SUBDOMAIN}.wormhole.bar"
          echo "=========================================================="
          
          echo "📋 Checking connection logs..."
          cat wormhole.log

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnels are active! Keeping the GitHub runner awake..."
          sleep 1h
