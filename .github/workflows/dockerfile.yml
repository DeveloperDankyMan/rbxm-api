name: Docker Build & Shared Wormhole Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-tunnel:
    timeout-minutes: 70
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Start Serveo Tunnel
        env:
          SUBDOMAIN: ${{ github.event.repository.name }}
          TUNNELTO_KEY: d8LnkQi1TYkv1vVhz9gGCRbuvcIy4CXH
        run: |
          echo "📥 Downloading and installing Tunnelto CLI..."
          # Downloads the binary straight into the runner's path environment
          curl -fsSL https://app.tunnelto.me/install.sh | sh -s -- --skip-setup
      
          echo "🔑 Pre-seeding headless token credentials configuration..."
          # Create the config directory where the client expects it
          mkdir -p ~/.tunnelto
          
          # Write the credential file dynamically to bypass interactive prompts
          echo "{\"token\":\"${TUNNELTO_TOKEN}\",\"name\":\"gh-actions-runner\"}" > ~/.tunnelto/client.json
      
          echo "⚙️ Adding custom tunnel routing mapping..."
          # Point your requested subdomain to target your container's 8080 port mapping
          tunnelto add "${SUBDOMAIN}" 8080
      
          echo "🔗 Starting Tunnelto background service daemon..."
          tunnelto start
      
          echo "⏳ Waiting for handshake validation..."
          sleep 5
      
          echo "=========================================================="
          echo "✨ YOUR ACTIVE PUBLIC URL IS:"
          echo "https://${SUBDOMAIN}.tunnelto.me"
          echo "=========================================================="
      
          echo "📋 Verifying connection active status..."
          tunnelto status

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnels are active! Keeping the GitHub runner awake..."
          sleep 1h
