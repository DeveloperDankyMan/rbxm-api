name: Docker Build & Shared Wormhole Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-tunnel:
    timeout-minutes: 70
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Start Serveo Tunnel
        env:
          SUBDOMAIN: ${{ github.event.repository.name }}
        run: |
          echo "🔗 Connecting directly via native SSH socket..."
          # Requests your custom subdomain instantly without a token setup
          ssh -o StrictHostKeyChecking=no -R ${SUBDOMAIN}.serveousercontent.com:80:localhost:8080 serveo.net > serveo.log 2>&1 &
      
          echo "⏳ Waiting for connection handshake..."
          sleep 3
          
          echo "=========================================================="
          echo "✨ YOUR SERVEO PUBLIC URL IS:"
          echo "https://${SUBDOMAIN}.serveousercontent.com"
          echo "=========================================================="

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnels are active! Keeping the GitHub runner awake..."
          sleep 1h
