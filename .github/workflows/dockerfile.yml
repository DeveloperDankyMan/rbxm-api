name: Docker Build & Shared Wormhole Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-tunnel:
    timeout-minutes: 70
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Start Serveo Tunnel
        env:
          SUBDOMAIN: ${{ github.event.repository.name }}
          TUNNELTO_KEY: d8LnkQi1TYkv1vVhz9gGCRbuvcIy4CXH
        run: |
         echo "📥 Downloading Tunnelto CLI..."
         curl -fsSL https://app.tunnelto.me/install.sh | sh -s -- -t "$TUNNELTO_KEY"
         sudo mv tunnelto /usr/local/bin/
      
         echo "🔗 Launching Headless Tunnel..."
         tunnelto --key "$TUNNELTO_KEY" --subdomain "$SUBDOMAIN" --port 8080 > tunnelto.log 2>&1 &
      
         sleep 5
         cat tunnelto.log

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnels are active! Keeping the GitHub runner awake..."
          sleep 1h
