name: Docker Build & Fast Public Tunnel

on:
  push:
    branches: [ "main" ]
  # Allows you to manually trigger this runner whenever you want from the Actions tab
  workflow_dispatch: 

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container in Background
        # -d spins it in the background, mapping port 8080
        run: docker run -d --rm -p 8080:8080 --name rbxm-api my-local-image:latest

      - name: Create High-Speed Public Link
        run: |
          echo "=========================================================="
          echo "🚀 Starting Pinggy SSH Tunnel..."
          echo "=========================================================="
          
          # 1. Establish tunnel & explicitly bind the Web Debugger API (-L4300:localhost:4300)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -fN \
            -p 443 \
            -L4300:localhost:4300 \
            -R0:localhost:8080 \
            free@a.pinggy.io

          # 2. Wait for the tunnel to initialize
          echo "⏳ Waiting for Pinggy to assign your live public URL..."
          sleep 5

          # 3. Request the dynamically assigned public URLs from the local debugger API
          echo "=========================================================="
          echo "🔗 LIVE PUBLIC URLS:"
          echo "=========================================================="
          curl -s http://localhost:4300/urls || echo "⚠️ URL fetching failed. Pinggy debugger could not be reached."
          echo "=========================================================="


      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnel is live! Keeping the GitHub runner awake..."
          # Adjust the sleep time below to control how long you want the link to stay alive
          # e.g., 30m = 30 minutes, 1h = 1 hour, 2h = 2 hours. Maximum runner limit is 6h.
          sleep 1h
