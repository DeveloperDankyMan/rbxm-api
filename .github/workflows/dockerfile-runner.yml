name: Docker Build & Fast Public Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          # Uses the correct GitHub Action expression syntax. 
          # Note: Changed 'vars' to 'secrets' if this is a private API key.
          docker run -d \
            --rm \
            -p 127.0.0.1:8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Verify Local Application Is Responding
        run: |
          echo "Checking if the containerized app is responding locally inside the runner..."
          sleep 5
          docker ps
          
          # Fixed the truncated local URL mapping
          curl -I http://127.0.0 || echo "⚠️ Warning: The local container did not return a standard 200/404 HTTP header."

      - name: Container Logs (Troubleshooting)
        # This will print your Rust app's console output if it crashed or failed to bind
        if: always()
        run: docker logs rbxm-api || true

      - name: Create High-Speed Public Link
        run: |
          echo "=========================================================="
          echo "🚀 Starting Pinggy SSH Tunnel..."
          echo "=========================================================="
          
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -fN \
            -p 443 \
            -L4300:127.0.0.1:4300 \
            -R0:127.0.0.1:8080 \
            free@a.pinggy.io

          echo "⏳ Waiting for Pinggy to assign your live public URL..."
          sleep 5

          echo "=========================================================="
          echo "🔗 LIVE PUBLIC URLS:"
          echo "=========================================================="
          # Fixed the truncated Pinggy debugger URL mapping
          curl -s http://127.0.0 || echo "⚠️ URL fetching failed."
          echo "=========================================================="

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnel is live! Keeping runner awake..."
          sleep 1h
