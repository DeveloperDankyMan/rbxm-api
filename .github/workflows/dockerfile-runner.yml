name: Docker Build & Permanent Cloudflare Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Launch Permanent Cloudflare Tunnel
        run: |
          echo "🚀 Downloading Cloudflare daemon..."
          curl -LO https://github.com
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          echo "🔗 Connecting named tunnel to rbxm-api subdomain..."
          # Running your dedicated tunnel using your secure token secret in the background
          cloudflared tunnel --no-autoupdate run --token "${{ secrets.CF_TUNNEL_TOKEN }}" &
          
          echo "=========================================================="
          echo "✨ Tunnel Active!"
          echo "🔗 Access your API at your custom domain root or /health path."
          echo "=========================================================="

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnel is live! Keeping runner awake..."
          sleep 1h
