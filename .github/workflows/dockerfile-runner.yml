name: Docker Build & Fast Public Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          # Leaving name as default or overriding via --name rbxm-api
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Verify Local Application Is Responding
        run: |
          echo "Checking if the containerized app is responding locally inside the runner..."
          sleep 5
          docker ps
          
          # Wrapping completely in strict string literals using localhost
          curl -I "http://localhost:8080/" || echo "⚠️ Warning: Could not reach port 8080 directly."

      - name: Container Logs (Troubleshooting)
        if: always()
        run: docker logs rbxm-api || true

      - name: Create High-Speed Public Link
        run: |
          echo "=========================================================="
          echo "🚀 Starting Pinggy SSH Tunnel..."
          echo "=========================================================="
          
          # Binding directly via localhost rules to dodge string parsers
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -fN \
            -p 443 \
            -L 4300:localhost:4300 \
            -R 0:localhost:8080 \
            free@a.pinggy.io u:Host:rbxm-api.com

          echo "⏳ Waiting for Pinggy to assign your live public URL..."
          sleep 6

          echo "=========================================================="
          echo "🔗 LIVE PUBLIC URLS:"
          echo "=========================================================="
          # Quoted layout string query execution
          curl -s "http://localhost:4300/urls" || echo "⚠️ URL fetching failed."
          echo "=========================================================="

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnel is live! Keeping runner awake..."
          sleep 1h
