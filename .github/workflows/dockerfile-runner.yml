name: Docker Build & Shared Ngrok Tunnel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-local-image:latest .

      - name: Run API Container with Environmental Variables
        run: |
          docker run -d \
            --rm \
            -p 8080:8080 \
            --name rbxm-api \
            -e RBXM_API_KEY="${{ secrets.RBXM_API_KEY || vars.RBXM_API_KEY }}" \
            my-local-image:latest

      - name: Launch Ephemeral Ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: "${{ github.event.repository.name }}.ngrok-free.app"
        run: |
          echo "🚀 Installing ngrok via official script..."
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
          | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null \
          && echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
          | sudo tee /etc/apt/sources.list.d/ngrok.list \
          && sudo apt update \
          && sudo apt install ngrok

          ngrok config check
          
          echo "🔐 Authenticating ngrok agent..."
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          
          echo "🔗 Connecting temporary tunnel to port 8080..."
          ngrok http 8080 --url "$NGROK_DOMAIN"
          
          # Allow the agent a brief moment to finish handshaking
          sleep 5
          
          echo "=========================================================="
          echo "✨ YOUR DYNAMIC API URL IS:"
          # Pulls the active address right out of ngrok's local runtime log
          grep -o 'url=https://[^ ]*' ngrok.log | cut -d= -f2 || echo "⚠️ Link extraction delayed. Check logs below."
          echo "=========================================================="

      - name: Output Log Check
        run: |
          echo "📋 Displaying connection info..."
          cat ngrok.log

      - name: Keep Runner Open for Use
        run: |
          echo "⏳ Tunnel is active! Keeping the GitHub runner awake..."
          sleep 1h
